# macOS starts screensharingd on demand when a remote viewer connects.
# Watch service availability, including idle sessions, rather than the process.
id: screen-sharing
name: Screen Sharing
process:
  match: screensharingd
checks:
  - type: launchd_service
    label: com.apple.screensharing
    port: 5900
messages:
  down: "Screen Sharing is disabled or unreachable. Enable it in System Settings > General > Sharing."
  keeps_happening: "Screen Sharing has failed 3 times in the last hour. Automatic fixes are paused."
fixes:
  stop:
    kind: stop
  restart:
    kind: restart
  force-restart:
    kind: force-restart
