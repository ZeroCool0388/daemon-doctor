# Generic AI desktop app. Change process.match if the executable name differs.
id: ai-desktop-app
name: AI Desktop App
process:
  match: ai-desktop-app
checks:
  - type: process_running
  - type: outbound_tcp
    port: 443
    consecutive: 3
messages:
  down: "AI Desktop App has stopped. It is not running."
  stuck: "AI Desktop App is running but it has no established outbound connection on port 443."
  keeps_happening: "AI Desktop App has failed 3 times in the last hour. Automatic fixes are paused."
fixes:
  stop:
    kind: stop
  restart:
    kind: restart
  force-restart:
    kind: force-restart
